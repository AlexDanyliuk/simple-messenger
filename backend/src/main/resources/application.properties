spring.application.name=simpleMessenger

#Postgres
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.security=DEBUG

server.port=8080

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.auth.cookie.access-name=${ACCESS_TOKEN_COOKIE_NAME:ACCESS_TOKEN}
app.auth.cookie.refresh-name=${REFRESH_TOKEN_COOKIE_NAME:REFRESH_TOKEN}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

app.encryption.key=${MESSAGE_ENCRYPTION_KEY:c2ltcGxlLW1lc3Nlbmdlci1kZXYta2V5LTMyIWJ5dGU=}

