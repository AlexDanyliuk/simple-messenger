spring.application.name=simpleMessenger

#Postgres
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.security=DEBUG

server.port=8080

app.upload.dir=uploads
app.upload.base-url=http://localhost:8080/files
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.auth.cookie.access-name=${ACCESS_TOKEN_COOKIE_NAME:ACCESS_TOKEN}
app.auth.cookie.refresh-name=${REFRESH_TOKEN_COOKIE_NAME:REFRESH_TOKEN}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

app.encryption.key=${MESSAGE_ENCRYPTION_KEY:c2ltcGxlLW1lc3Nlbmdlci1kZXYta2V5LTMyIWJ5dGU=}

# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:stub@example.com}
spring.mail.password=${MAIL_PASSWORD:stub-password}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}

app.mail.from=${APP_MAIL_FROM:stub@example.com}
app.mail.reset.subject=${APP_MAIL_RESET_SUBJECT:Simple Messenger password reset code}
app.mail.reset.code-ttl-minutes=${APP_MAIL_RESET_CODE_TTL_MINUTES:10}
app.mail.registration.subject=${APP_MAIL_REGISTRATION_SUBJECT:Simple Messenger registration verification code}
app.mail.registration.code-ttl-minutes=${APP_MAIL_REGISTRATION_CODE_TTL_MINUTES:10}

